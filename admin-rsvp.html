<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin RSVP — Gabriel & Jéssica</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Tokens da identidade "Clássico Romântico". Esta é a tela interna dos
       noivos: adota a base e a tipografia da identidade, mas mantém as cores
       semânticas de status (verde/vermelho) — ali a cor informa, não decora. */
    :root {
      --gold:   #C9A24A;
      --gold-dk:#8F5F22;
      --cream:  #FBF7EA;
      --surface:#F7EFD4;
      --border: rgba(91, 65, 39, 0.14);
      --text:   #5B4127;
      --muted:  #7A5A39;
      --fuchsia:#C32B6E;
      --butter-deep:#F4E4B0;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'EB Garamond', Georgia, serif;
      --font-label:   'Jost', system-ui, sans-serif;
    }
    body { font-family: var(--font-body); font-size: 16px; background: var(--cream); color: var(--text); }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed; inset: 0;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #auth-overlay.hidden { display: none; }
    .auth-card {
      background: var(--surface);
      border-radius: 3px;
      padding: 48px 40px;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    .auth-card .monogram {
      display: block; height: 64px; width: auto;
      margin: 0 auto 12px;
    }
    .auth-card h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .auth-card p  { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .auth-card input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 14px 16px; font-size: 15px; font-family: var(--font-label);
      outline: none; transition: border-color 0.2s; margin-bottom: 12px;
    }
    .auth-card input:focus { border-color: var(--gold); }
    .auth-card .err { font-size: 14px; color: var(--fuchsia); margin-bottom: 12px; display: none; }
    .auth-card .err.show { display: block; }
    .btn {
      display: inline-block; padding: 14px 28px;
      background: var(--fuchsia); color: var(--butter-deep); border: none;
      border-radius: 40px; font-family: var(--font-label);
      font-size: 12px; font-weight: 500; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #A82259; transform: translateY(-1px); }
    .btn.outline {
      background: transparent; color: var(--gold);
      border: 1.5px solid var(--gold);
    }
    .btn.outline:hover { background: rgba(201,168,108,0.08); }
    .btn.sm { padding: 8px 16px; font-size: 10px; }

    /* ── App ── */
    #app { display: none; }
    #app.show { display: block; }

    header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-brand .monogram { display: block; height: 34px; width: auto; }
    .header-brand .title { font-size: 13px; font-weight: 600; }
    .header-brand .sub   { font-size: 11px; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Stats bar ── */
    .stats {
      display: flex; gap: 24px; flex-wrap: wrap;
      padding: 16px 32px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .stat { font-size: 12px; }
    .stat strong { font-size: 22px; font-weight: 700; color: var(--text); display: block; }
    .stat span   { color: var(--muted); }

    /* ── Filtros ── */
    .filtros {
      padding: 16px 32px; display: flex; gap: 12px; flex-wrap: wrap;
      align-items: center; border-bottom: 1px solid var(--border);
    }
    .filtros input {
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-family: var(--font-label);
      outline: none; transition: border-color 0.2s; min-width: 220px;
    }
    .filtros input:focus { border-color: var(--gold); }
    .filtro-btn {
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      background: #fff; font-size: 12px; font-family: var(--font-label);
      cursor: pointer; transition: all 0.15s; color: var(--muted);
    }
    .filtro-btn.active { border-color: var(--gold); color: var(--gold-dk); font-weight: 600; }

    /* ── Grid de convites ── */
    .convites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 24px 32px;
    }

    .convite-card {
      background: #fff; border-radius: 12px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .convite-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .convite-card.confirmado { border-color: #c6f6d5; }

    .cc-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .cc-grupo { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .cc-codigo {
      font-family: monospace; font-size: 14px; font-weight: 700;
      letter-spacing: 2px; color: var(--gold);
      background: rgba(201,168,108,0.1); padding: 4px 10px; border-radius: 6px;
      white-space: nowrap;
    }

    .cc-body { padding: 14px 18px; }
    .cc-nomes { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
    .cc-nomes .sim { color: #276749; font-weight: 600; }
    .cc-nomes .nao { color: #c53030; text-decoration: line-through; opacity: 0.7; }
    .cc-nomes .pendente { color: var(--muted); }
    .cc-nomes .cerimonia { color: #2b6cb0; font-weight: 600; }

    .cc-meta {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-bottom: 10px;
    }
    .badge {
      padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-papel    { background: #ebf8ff; color: #2b6cb0; }
    .badge-digital  { background: #f0fff4; color: #276749; }
    .badge-ok       { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
    .badge-pendente { background: #fffbeb; color: #b7791f; border: 1px solid #fefcbf; }

    .cc-link {
      font-size: 11px; color: var(--muted); word-break: break-all;
      margin-bottom: 8px;
    }
    .cc-link a { color: var(--gold); text-decoration: none; }
    .cc-link a:hover { text-decoration: underline; }

    .cc-qr {
      text-align: center; padding: 8px 0 4px;
      border-top: 1px dashed var(--border);
      margin-top: 8px;
    }
    .cc-qr img { width: 120px; height: 120px; border-radius: 8px; }

    .cc-acoes { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* ── Modal de edição ── */
    #modal {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(91, 65, 39, 0.35);
      display: none; align-items: flex-start; justify-content: center;
      padding: 48px 16px; overflow-y: auto;
    }
    #modal.show { display: flex; }
    .modal-card {
      background: var(--cream); border-radius: 12px;
      width: 100%; max-width: 480px; padding: 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal-card h2 {
      font-family: var(--font-display); font-size: 24px; font-weight: 600;
      margin-bottom: 18px;
    }
    .campo { margin-bottom: 16px; }
    .campo label {
      display: block; font-family: var(--font-label); font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
      margin-bottom: 6px;
    }
    .campo input, .campo select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 15px; font-family: var(--font-body);
      background: #fff; color: var(--text); outline: none;
    }
    .campo input:focus, .campo select:focus { border-color: var(--gold); }
    .campo .dica { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .pessoa { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .pessoa input { flex: 1; }
    .pessoa .resposta { font-size: 12px; width: 18px; text-align: center; }
    .pessoa .remover {
      border: none; background: none; color: #c53030; font-size: 20px;
      cursor: pointer; padding: 0 6px; line-height: 1;
    }
    .modal-erro { color: #c53030; font-size: 14px; margin-bottom: 12px; display: none; }
    .modal-erro.show { display: block; }
    .modal-acoes {
      display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap;
      margin-top: 20px;
    }
    .modal-acoes .dir { display: flex; gap: 8px; }
    .btn.perigo { background: transparent; color: #c53030; border: 1.5px solid #c53030; }
    .btn.perigo:hover { background: rgba(197,48,48,0.08); }

    /* ── Abas ── */
    .abas {
      display: flex; gap: 4px; padding: 0 32px;
      background: #fff; border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .aba {
      padding: 14px 18px; border: none; background: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font-label); font-size: 12px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted); cursor: pointer;
      white-space: nowrap;
    }
    .aba.active { color: var(--gold-dk); border-bottom-color: var(--gold); font-weight: 600; }
    .aba .qtd {
      display: inline-block; margin-left: 6px; padding: 1px 7px;
      border-radius: 10px; background: var(--surface); font-size: 10px;
    }
    .painel { display: none; }
    .painel.active { display: block; }

    /* ── Lista de convidados ── */
    .resumo-lista { padding: 12px 32px 0; font-size: 14px; color: var(--muted); }
    .tabela-wrap { padding: 12px 32px 32px; overflow-x: auto; }
    table.pessoas {
      width: 100%; border-collapse: collapse; background: #fff;
      border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
      font-size: 15px;
    }
    table.pessoas th {
      text-align: left; padding: 10px 14px; background: var(--surface);
      font-family: var(--font-label); font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted); font-weight: 500;
    }
    table.pessoas td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
    table.pessoas td.codigo { font-family: monospace; font-weight: 700; letter-spacing: 1px; color: var(--gold-dk); }
    table.pessoas td .grupo-link {
      border: none; background: none; padding: 0; font: inherit;
      color: var(--text); text-decoration: underline dotted; cursor: pointer;
    }
    .badge-sim       { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
    .badge-cerimonia { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
    .badge-nao       { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }

    /* ── Recados ── */
    .recados { padding: 24px 32px; display: grid; gap: 16px; max-width: 760px; }
    .recado {
      background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
      padding: 18px 20px;
    }
    .recado-topo {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .recado-nome { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
    .recado-data { font-family: var(--font-label); font-size: 11px; color: var(--muted); }
    .recado-texto { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .vazio { padding: 32px; color: var(--muted); }

    @media (max-width: 600px) {
      header, .stats, .filtros, .abas, .resumo-lista, .tabela-wrap, .recados, .convites-grid { padding-left: 16px; padding-right: 16px; }
      .filtros input { min-width: 0; width: 100%; }
    }

    /* ── Print ── */
    @media print {
      #auth-overlay, header, .filtros, .header-actions, .stats, .abas, .cc-acoes, #modal, #aba-convidados, #aba-recados { display: none !important; }
      #aba-convites { display: block !important; }
      .convites-grid { grid-template-columns: repeat(2, 1fr); padding: 0; gap: 12px; }
      .convite-card { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="auth-overlay">
  <div class="auth-card">
    <img src="images/identidade/monograma-gold.png" alt="Gabriel e Jéssica" class="monogram" width="64" height="64">
    <h1>Área Admin</h1>
    <p>Digite a senha de administrador para acessar a lista de convites.</p>
    <input type="password" id="token-input" placeholder="Senha" autocomplete="off">
    <div id="auth-err" class="err">Senha inválida. Tente novamente.</div>
    <button class="btn" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-brand">
      <img src="images/identidade/monograma-gold.png" alt="Gabriel e Jéssica" class="monogram" width="34" height="34">
      <div>
        <div class="title">Painel de Confirmações</div>
        <div class="sub">Lista de convidados — RSVP</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn outline sm" onclick="abrirEdicao()">＋ Novo convite</button>
      <button class="btn outline sm" onclick="exportarCSV()">⬇ Exportar CSV</button>
      <button class="btn outline sm" onclick="baixarMensagensConvite()">💌 Baixar mensagens dos convites</button>
      <button class="btn outline sm" onclick="window.print()">🖨 Imprimir QR codes</button>
      <button class="btn sm" onclick="carregarDados(true)">↻ Atualizar</button>
    </div>
  </header>

  <div class="stats" id="stats-bar"></div>

  <nav class="abas" role="tablist">
    <button class="aba active" data-aba="convites" onclick="abrirAba('convites')">Convites</button>
    <button class="aba" data-aba="convidados" onclick="abrirAba('convidados')">Convidados</button>
    <button class="aba" data-aba="recados" onclick="abrirAba('recados')">Recados <span class="qtd" id="qtd-recados">–</span></button>
  </nav>

  <section id="aba-convites" class="painel active">
  <div class="filtros">
    <input type="text" id="busca" placeholder="Filtrar por grupo, código ou nome..." oninput="filtrar()">
    <button class="filtro-btn active" onclick="setFiltro('todos', this)">Todos</button>
    <button class="filtro-btn" onclick="setFiltro('pendente', this)">Pendentes</button>
    <button class="filtro-btn" onclick="setFiltro('confirmado', this)">Confirmados</button>
    <button class="filtro-btn" onclick="setFiltro('papel', this)">Papel</button>
    <button class="filtro-btn" onclick="setFiltro('digital', this)">Digital</button>
  </div>

  <div class="convites-grid" id="grid"></div>
  </section>

  <!-- Uma linha por pessoa: para achar alguém pelo nome e ver a resposta -->
  <section id="aba-convidados" class="painel">
    <div class="filtros" id="filtros-pessoas">
      <input type="search" id="busca-pessoa" placeholder="Buscar convidado pelo nome..." oninput="renderPessoas()">
      <button class="filtro-btn active" data-filtro="todos"     onclick="setFiltroPessoa('todos')">Todos</button>
      <button class="filtro-btn" data-filtro="vao"       onclick="setFiltroPessoa('vao')">Confirmados</button>
      <button class="filtro-btn" data-filtro="cerimonia" onclick="setFiltroPessoa('cerimonia')">Só cerimônia</button>
      <button class="filtro-btn" data-filtro="nao"       onclick="setFiltroPessoa('nao')">Não vão</button>
      <button class="filtro-btn" data-filtro="pendente"  onclick="setFiltroPessoa('pendente')">Sem resposta</button>
      <button class="filtro-btn" onclick="exportarPessoasCSV()">⬇ CSV desta lista</button>
    </div>
    <div class="resumo-lista" id="resumo-pessoas"></div>
    <div class="tabela-wrap">
      <table class="pessoas">
        <thead><tr><th>Convidado</th><th>Resposta</th><th>Grupo</th><th>Código</th><th>Respondeu em</th></tr></thead>
        <tbody id="tbody-pessoas"></tbody>
      </table>
    </div>
  </section>

  <section id="aba-recados" class="painel">
    <div class="filtros">
      <input type="search" id="busca-recado" placeholder="Buscar nos recados..." oninput="renderRecados()">
      <button class="filtro-btn" onclick="carregarRecados()">↻ Atualizar recados</button>
    </div>
    <div class="recados" id="lista-recados"></div>
  </section>
</div>

<!-- Modal: criar/editar convite -->
<div id="modal" onclick="if (event.target === this) fecharEdicao()">
  <form class="modal-card" onsubmit="salvarConvite(event)">
    <h2 id="modal-titulo">Novo convite</h2>
    <div class="campo">
      <label for="f-grupo">Grupo</label>
      <input id="f-grupo" required maxlength="120" placeholder="Ex.: Família Silva">
    </div>
    <div class="campo">
      <label for="f-entrega">Entrega</label>
      <select id="f-entrega">
        <option value="digital">Digital</option>
        <option value="papel">Papel</option>
      </select>
    </div>
    <div class="campo">
      <label for="f-codigo">Código</label>
      <input id="f-codigo" maxlength="30" pattern="[A-Za-z0-9\-]*" placeholder="Deixe vazio para gerar">
      <div class="dica">Mudar o código invalida o link e o QR code já enviados.</div>
    </div>
    <div class="campo">
      <label>Convidados</label>
      <div id="f-pessoas"></div>
      <button type="button" class="btn outline sm" onclick="adicionarPessoa()">＋ Adicionar pessoa</button>
    </div>
    <div id="modal-erro" class="modal-erro"></div>
    <div class="modal-acoes">
      <button type="button" class="btn perigo sm" id="btn-excluir" onclick="excluirConvite()">Excluir convite</button>
      <div class="dir">
        <button type="button" class="btn outline sm" onclick="fecharEdicao()">Cancelar</button>
        <button type="submit" class="btn sm" id="btn-salvar">Salvar</button>
      </div>
    </div>
  </form>
</div>

<script src="config.js"></script>
<script>
let _token    = sessionStorage.getItem('admin_token') || '';
let _todos    = [];
let _filtroAtivo = 'todos';
let _recados  = null; // recados do site; null = ainda não carregados

// ── Auth ─────────────────────────────────────────────────────────────────────
async function entrar() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  const ok = await testarToken(t);
  if (ok) {
    _token = t;
    sessionStorage.setItem('admin_token', t);
    document.getElementById('auth-overlay').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    carregarDados();
  } else {
    document.getElementById('auth-err').classList.add('show');
  }
}

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') entrar();
});

async function testarToken(t) {
  try {
    const r = await fetch(`${API_URL}/api/admin/convites`, {
      headers: { 'Authorization': `Bearer ${t}` },
    });
    return r.ok;
  } catch { return false; }
}

// ── Carregar dados ────────────────────────────────────────────────────────────
async function carregarDados(forcar = false) {
  try {
    const r = await fetch(`${API_URL}/api/admin/convites`, {
      headers: { 'Authorization': `Bearer ${_token}` },
    });
    if (!r.ok) {
      if (r.status === 401) { sessionStorage.removeItem('admin_token'); location.reload(); }
      return;
    }
    _todos = await r.json();
    renderStats();
    filtrar();
    renderPessoas();
    if (forcar || _recados === null) carregarRecados();
  } catch (e) {
    alert('Erro ao carregar dados: ' + e.message);
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const total       = _todos.length;
  const confirmados = _todos.filter(c => c.confirmadoEm).length;
  const pendentes   = total - confirmados;
  const totalPessoas = _todos.reduce((s, c) => s + c.convidados.length, 0);
  const pessoas      = _todos.flatMap(c => c.convidados);
  const confirmouSim = pessoas.filter(p => p.vaiComparecer === true).length;
  const soCerimonia  = pessoas.filter(p => statusPessoa(p) === 'cerimonia').length;
  const confirmouNao = pessoas.filter(p => p.vaiComparecer === false).length;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><strong>${total}</strong><span>convites</span></div>
    <div class="stat"><strong style="color:#276749">${confirmados}</strong><span>confirmados</span></div>
    <div class="stat"><strong style="color:#b7791f">${pendentes}</strong><span>pendentes</span></div>
    <div class="stat"><strong>${totalPessoas}</strong><span>pessoas</span></div>
    <div class="stat"><strong style="color:#276749">${confirmouSim}</strong><span>vão ao casamento</span></div>
    <div class="stat"><strong style="color:#2b6cb0">${soCerimonia}</strong><span>só na cerimônia</span></div>
    <div class="stat"><strong style="color:#c53030">${confirmouNao}</strong><span>não virão</span></div>
  `;
}

// ── Filtro ────────────────────────────────────────────────────────────────────
function setFiltro(f, btn) {
  _filtroAtivo = f;
  document.querySelectorAll('#aba-convites .filtro-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtrar();
}

function filtrar() {
  const q = normalizar(document.getElementById('busca').value);
  let lista = _todos.filter(c => {
    if (_filtroAtivo === 'confirmado' && !c.confirmadoEm) return false;
    if (_filtroAtivo === 'pendente'   &&  c.confirmadoEm) return false;
    if (_filtroAtivo === 'papel'   && c.entrega !== 'papel')   return false;
    if (_filtroAtivo === 'digital' && c.entrega !== 'digital') return false;
    if (!q) return true;
    return normalizar(c.grupo).includes(q) || normalizar(c.codigo).includes(q)
      || c.convidados.some(p => normalizar(p.nome).includes(q));
  });
  renderGrid(lista);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderGrid(lista) {
  const grid = document.getElementById('grid');
  if (lista.length === 0) {
    grid.innerHTML = `<p style="padding:32px;color:var(--muted);grid-column:1/-1">Nenhum convite encontrado.</p>`;
    return;
  }

  grid.innerHTML = lista.map(c => {
    const nomesHtml = c.convidados.map(p => {
      const st = statusPessoa(p);
      const icone = { sim: '✓ ', cerimonia: '⛪ ', nao: '✗ ', pendente: '• ' }[st];
      const extra = st === 'cerimonia' ? ' <small>(só cerimônia)</small>' : '';
      return `<span class="${st}">${icone}${esc(p.nome)}${extra}</span>`;
    }).join('<br>');

    const status = c.confirmadoEm
      ? `<span class="badge badge-ok">Confirmado</span>`
      : `<span class="badge badge-pendente">Pendente</span>`;

    const entregaBadge = c.entrega === 'papel'
      ? `<span class="badge badge-papel">📄 Papel</span>`
      : `<span class="badge badge-digital">💬 Digital</span>`;

    const qrHtml = c.qrCode
      ? `<div class="cc-qr"><img src="${c.qrCode}" alt="QR Code ${c.codigo}"></div>`
      : '';

    return `
      <div class="convite-card ${c.confirmadoEm ? 'confirmado' : ''}">
        <div class="cc-header">
          <div class="cc-grupo">${esc(c.grupo)}</div>
          <div class="cc-codigo">${esc(c.codigo)}</div>
        </div>
        <div class="cc-body">
          <div class="cc-meta">${entregaBadge} ${status}</div>
          <div class="cc-nomes">${nomesHtml}</div>
          <div class="cc-link">
            🔗 <a href="${esc(c.link)}" target="_blank">${esc(c.link)}</a>
            <button class="btn outline sm" style="margin-left:8px" onclick="copiar('${esc(c.link)}')">Copiar</button>
          </div>
          ${qrHtml}
          <div class="cc-acoes">
            <button class="btn outline sm" onclick="copiarMensagem('${c.id}')">💌 Copiar mensagem</button>
            <button class="btn outline sm" onclick="abrirEdicao('${c.id}')">✎ Editar</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// 'sim' (cerimônia e recepção) | 'cerimonia' (só cerimônia) | 'nao' | 'pendente'
function statusPessoa(p) {
  if (p.vaiComparecer === true) return p.apenasCerimonia ? 'cerimonia' : 'sim';
  if (p.vaiComparecer === false) return 'nao';
  return 'pendente';
}

const ROTULO_STATUS = {
  sim: 'Vai (cerimônia e recepção)',
  cerimonia: 'Só cerimônia',
  nao: 'Não vai',
  pendente: 'Sem resposta',
};

// Busca sem diferença de acento e maiúsculas: "joao" acha "João"
function normalizar(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function copiar(texto, aviso = 'Link copiado!') {
  navigator.clipboard.writeText(texto).then(() => {
    const t = document.createElement('div');
    t.textContent = aviso;
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#5B4127;color:#F4E4B0;padding:10px 24px;border-radius:50px;font-size:13px;z-index:9999';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  });
}

// ── Criar / editar convite ────────────────────────────────────────────────────
let _editandoId = null;

function abrirEdicao(id) {
  const c = id ? _todos.find(x => x.id === id) : null;
  _editandoId = c ? c.id : null;
  document.getElementById('modal-titulo').textContent = c ? 'Editar convite' : 'Novo convite';
  document.getElementById('f-grupo').value   = c ? c.grupo : '';
  document.getElementById('f-entrega').value = c ? c.entrega : 'digital';
  document.getElementById('f-codigo').value  = c ? c.codigo : '';
  document.getElementById('f-pessoas').innerHTML = '';
  (c ? c.convidados : [{}]).forEach(adicionarPessoa);
  document.getElementById('btn-excluir').style.visibility = c ? 'visible' : 'hidden';
  mostrarErroModal('');
  document.getElementById('modal').classList.add('show');
  document.getElementById('f-grupo').focus();
}

function fecharEdicao() {
  document.getElementById('modal').classList.remove('show');
  _editandoId = null;
}

// `p` vem da lista do convite (id + nome + resposta) ou vazio para pessoa nova
function adicionarPessoa(p = {}) {
  const linha = document.createElement('div');
  linha.className = 'pessoa';
  if (p.id) linha.dataset.id = p.id;
  const resposta = { sim: '✓', cerimonia: '⛪', nao: '✗', pendente: '' }[statusPessoa(p)];
  linha.innerHTML = `
    <span class="resposta" title="Resposta do RSVP">${resposta}</span>
    <input required maxlength="120" placeholder="Nome" value="${esc(p.nome || '')}">
    <button type="button" class="remover" title="Remover" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById('f-pessoas').appendChild(linha);
  if (!p.nome) linha.querySelector('input').focus();
}

function mostrarErroModal(msg) {
  const el = document.getElementById('modal-erro');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

async function salvarConvite(e) {
  e.preventDefault();
  const convidados = [...document.querySelectorAll('#f-pessoas .pessoa')].map(l => ({
    ...(l.dataset.id ? { id: l.dataset.id } : {}),
    nome: l.querySelector('input').value.trim(),
  })).filter(p => p.nome);
  if (convidados.length === 0) {
    mostrarErroModal('Inclua pelo menos uma pessoa no convite.');
    return;
  }

  const corpo = {
    grupo:   document.getElementById('f-grupo').value.trim(),
    entrega: document.getElementById('f-entrega').value,
    codigo:  document.getElementById('f-codigo').value.trim(),
    convidados,
  };
  const url = _editandoId
    ? `${API_URL}/api/admin/convites/${_editandoId}`
    : `${API_URL}/api/admin/convites`;

  await enviarAdmin(url, _editandoId ? 'PUT' : 'POST', corpo);
}

async function excluirConvite() {
  const c = _todos.find(x => x.id === _editandoId);
  if (!c) return;
  const respondeu = c.confirmadoEm ? ' Este convite já respondeu o RSVP.' : '';
  if (!confirm(`Excluir o convite "${c.grupo}" e todas as ${c.convidados.length} pessoa(s)?${respondeu}`)) return;
  await enviarAdmin(`${API_URL}/api/admin/convites/${c.id}`, 'DELETE');
}

async function enviarAdmin(url, method, corpo) {
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  try {
    const r = await fetch(url, {
      method,
      headers: {
        'Authorization': `Bearer ${_token}`,
        ...(corpo ? { 'Content-Type': 'application/json' } : {}),
      },
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
    if (r.status === 401) { sessionStorage.removeItem('admin_token'); location.reload(); return; }
    if (!r.ok) {
      const dados = await r.json().catch(() => ({}));
      const msg = Array.isArray(dados.message) ? dados.message.join(' ') : dados.message;
      mostrarErroModal(msg || `Erro ${r.status} ao salvar.`);
      return;
    }
    fecharEdicao();
    await carregarDados();
  } catch (err) {
    mostrarErroModal('Erro de conexão: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('show')) fecharEdicao();
});

// ── Exportar CSV ──────────────────────────────────────────────────────────────
function exportarCSV() {
  const linhas = [
    ['Grupo', 'Código', 'Entrega', 'Convidado', 'Vai Comparecer', 'Confirmado Em', 'Link'],
  ];

  _todos.forEach(c => {
    c.convidados.forEach(p => {
      linhas.push([
        c.grupo,
        c.codigo,
        c.entrega,
        p.nome,
        ROTULO_STATUS[statusPessoa(p)],
        c.confirmadoEm ? new Date(c.confirmadoEm).toLocaleString('pt-BR') : '',
        c.link,
      ]);
    });
  });

  baixarCSV(linhas, 'rsvp-casamento.csv');
}

// ── Mensagens para enviar com o convite ───────────────────────────────────────
// Mesmo texto de dados/mensagens-convites.txt, gerado da lista atual do painel:
// convite criado ou editado aqui já sai com o código certo.
function mensagemConvite(c) {
  return `🤍 Com imensa alegria, compartilhamos este convite para celebrar um dos momentos mais especiais de nossas vidas: o nosso casamento, que com a poderosa intercessão de Nossa Senhora do Carmo, São José e Santa Teresinha, tornou-se um sonho concreto.🌹

Será uma honra contar com sua presença nesse dia tão significativo, preparado com muito amor, carinho e simplicidade.

*Data*: 05 de dezembro de 2026 
*Local da cerimônia*: Igreja Nossa Senhora do Carmo - Centro
*Horário:* 9h30

✨ Este convite é pessoal e possui um código individual para acesso e confirmação de presença no site.
O código desse convite: ${c.codigo}

Com carinho, esperamos sua confirmação celebrar esse momento inesquecível!`;
}

// "Ana", "Ana e Bia", "Ana, Bia e Caio"
function juntarNomes(nomes) {
  return nomes.length <= 1 ? (nomes[0] || '') : nomes.slice(0, -1).join(', ') + ' e ' + nomes.at(-1);
}

function baixarMensagensConvite() {
  if (_todos.length === 0) { alert('Nenhum convite cadastrado.'); return; }
  const blocos = _todos.map((c, i) => {
    const entrega = c.entrega === 'papel' ? 'impresso' : 'digital';
    return `=== Convite ${i + 1} | ${c.grupo} | ${entrega} | Senha: ${c.codigo} ===
Enviar para: ${juntarNomes(c.convidados.map(p => p.nome))}

${mensagemConvite(c)}

------------------------------------------------------------
`;
  });
  const blob = new Blob([blocos.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'mensagens-convites.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function copiarMensagem(id) {
  const c = _todos.find(x => x.id === id);
  if (c) copiar(mensagemConvite(c), 'Mensagem copiada!');
}

// Gera o arquivo com BOM para o Excel abrir os acentos corretamente
function baixarCSV(linhas, nomeArquivo) {
  const csv = linhas.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = nomeArquivo;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Abas ──────────────────────────────────────────────────────────────────────
function abrirAba(nome) {
  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('active', b.dataset.aba === nome));
  document.querySelectorAll('.painel').forEach(p => p.classList.toggle('active', p.id === `aba-${nome}`));
  const busca = { convites: 'busca', convidados: 'busca-pessoa', recados: 'busca-recado' }[nome];
  document.getElementById(busca).focus();
}

// ── Convidados (uma linha por pessoa) ─────────────────────────────────────────
let _filtroPessoa = 'todos';

function setFiltroPessoa(f) {
  _filtroPessoa = f;
  document.querySelectorAll('#filtros-pessoas .filtro-btn[data-filtro]')
    .forEach(b => b.classList.toggle('active', b.dataset.filtro === f));
  renderPessoas();
}

function pessoasFiltradas() {
  const q = normalizar(document.getElementById('busca-pessoa').value);
  return _todos
    .flatMap(c => c.convidados.map(p => ({ ...p, convite: c, status: statusPessoa(p) })))
    .filter(p => {
      // "Confirmados" = todos que vão, inclusive quem vai só à cerimônia
      if (_filtroPessoa === 'vao' && !['sim', 'cerimonia'].includes(p.status)) return false;
      if (['cerimonia', 'nao', 'pendente'].includes(_filtroPessoa) && p.status !== _filtroPessoa) return false;
      return !q || normalizar(p.nome).includes(q);
    })
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}

function renderPessoas() {
  const lista = pessoasFiltradas();
  const busca = document.getElementById('busca-pessoa').value.trim();
  document.getElementById('resumo-pessoas').textContent =
    `${lista.length} pessoa${lista.length === 1 ? '' : 's'}` + (busca ? ` para "${busca}"` : '');

  const tbody = document.getElementById('tbody-pessoas');
  if (lista.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="vazio">${busca
      ? 'Ninguém com esse nome na lista de convidados.'
      : 'Nenhum convidado neste filtro.'}</td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(p => `
    <tr>
      <td>${esc(p.nome)}</td>
      <td><span class="badge badge-${p.status === 'pendente' ? 'pendente' : p.status}">${ROTULO_STATUS[p.status]}</span></td>
      <td><button class="grupo-link" title="Editar convite" onclick="abrirEdicao('${p.convite.id}')">${esc(p.convite.grupo)}</button></td>
      <td class="codigo">${esc(p.convite.codigo)}</td>
      <td>${p.convite.confirmadoEm ? new Date(p.convite.confirmadoEm).toLocaleDateString('pt-BR') : '—'}</td>
    </tr>`).join('');
}

function exportarPessoasCSV() {
  const linhas = [['Convidado', 'Resposta', 'Grupo', 'Código', 'Respondeu em']];
  pessoasFiltradas().forEach(p => linhas.push([
    p.nome,
    ROTULO_STATUS[p.status],
    p.convite.grupo,
    p.convite.codigo,
    p.convite.confirmadoEm ? new Date(p.convite.confirmadoEm).toLocaleString('pt-BR') : '',
  ]));
  baixarCSV(linhas, `convidados-${_filtroPessoa}.csv`);
}

// ── Recados deixados no site ──────────────────────────────────────────────────

async function carregarRecados() {
  try {
    const r = await fetch(`${API_URL}/api/admin/mensagens`, {
      headers: { 'Authorization': `Bearer ${_token}` },
    });
    if (!r.ok) throw new Error(`Erro ${r.status}`);
    _recados = await r.json();
    document.getElementById('qtd-recados').textContent = _recados.length;
    renderRecados();
  } catch (e) {
    document.getElementById('lista-recados').innerHTML =
      `<p class="vazio">Não foi possível carregar os recados (${esc(e.message)}).</p>`;
  }
}

function renderRecados() {
  if (_recados === null) return;
  const q = normalizar(document.getElementById('busca-recado').value);
  const lista = _recados.filter(m => !q || normalizar(m.nome).includes(q) || normalizar(m.texto).includes(q));
  const el = document.getElementById('lista-recados');
  if (lista.length === 0) {
    el.innerHTML = `<p class="vazio">${_recados.length ? 'Nenhum recado encontrado.' : 'Ainda não chegou nenhum recado.'}</p>`;
    return;
  }
  el.innerHTML = lista.map(m => `
    <article class="recado">
      <div class="recado-topo">
        <span class="recado-nome">${esc(m.nome)}</span>
        <span class="recado-data">${new Date(m.createdAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>
      </div>
      <div class="recado-texto">${esc(m.texto)}</div>
    </article>`).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (_token) {
  testarToken(_token).then(ok => {
    if (ok) {
      document.getElementById('auth-overlay').classList.add('hidden');
      document.getElementById('app').classList.add('show');
      carregarDados();
    } else {
      sessionStorage.removeItem('admin_token');
      _token = '';
    }
  });
}
</script>
